[project]
name = "dsci-522-group-40-iris-species-prediction"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "altair==6.3.0",
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
    "nbclient==0.11.0",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
]

[tool.uv]
# `uv add` writes an exact version (==)
add-bounds = "exact"
